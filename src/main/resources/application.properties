#---------------------------------------------------------
spring.application.name=CadastroDeNinjas
spring.datasource.url=jdbc:postgresql://localhost:5431/cadastrodeninja
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuracoes do HIBERNATES
spring.jpa.databese-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Configurar o flyway
spring.flyway.enable=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true
